# Service interno do banco (ClusterIP). A aplicação conecta usando o nome banco-service.
apiVersion: v1
kind: Service
metadata:
  name: banco-service
spec:
  type: ClusterIP
  selector:
    app: banco
  ports:
    - port: 5432
      targetPort: 5432
