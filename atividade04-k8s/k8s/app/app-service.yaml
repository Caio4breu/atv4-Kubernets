# Expõe a aplicação para o navegador (NodePort). Distribui as requisições entre as réplicas.
apiVersion: v1
kind: Service
metadata:
  name: app-service
spec:
  type: NodePort
  selector:
    app: app
  ports:
    - port: 80
      targetPort: 3000
